name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o klima-tile.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: proj
      - run: cp proj/app/build/outputs/apk/debug/app-debug.apk klima-tile.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Son derleme
          files: klima-tile.apk
